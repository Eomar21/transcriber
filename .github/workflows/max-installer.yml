name: Build Mac Installer

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_DIR: source/Transcriber

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The newest MacCatalyst workload needs a newer Xcode than the runner has, so pin the
      # workload versions (see .github/mac-workloads.json) to ones that match the installed Xcode 26.
      - name: Install MAUI Mac Catalyst workload
        run: dotnet workload install maui-maccatalyst --from-rollback-file .github/mac-workloads.json

      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/models
          key: bundled-whisper-model-5359861c739e955e79d9a303bcbc70fb988958b1-small

      - name: Publish Mac app
        run: >
          dotnet publish ${{ env.SOLUTION_DIR }}/Transcriber.Maui/Transcriber.Maui.csproj
          -f net10.0-maccatalyst -c Release -p:RuntimeIdentifier=maccatalyst-arm64
          -p:CreatePackage=false -p:EnableCodeSigning=false -p:EnablePackageSigning=false
          -o publish/mac -v:detailed "-flp:v=detailed;logfile=mac-build.log"

      - name: Zip the app
        run: |
          cd publish/mac
          ditto -c -k --keepParent Transcriber.Maui.app ../../Transcriber-mac-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Transcriber-mac-arm64
          path: Transcriber-mac-arm64.zip
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: mac-build.log
