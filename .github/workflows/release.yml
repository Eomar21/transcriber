name: Release

# Publishes a GitHub Release ONLY when a version tag is pushed, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# Running it by hand (workflow_dispatch) builds and uploads the zip as a workflow artifact
# for inspection but never creates a release.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_DIR: source/Transcriber

jobs:
  windows:
    name: Build Windows package
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TRANSCRIBER_TEST_CPU: '1'
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            full="${GITHUB_REF_NAME#v}"
          else
            full="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          # MAUI needs a strict x.y.z display version and an integer build number.
          echo "version=${full}" >> "$GITHUB_OUTPUT"
          echo "core=${full%%-*}" >> "$GITHUB_OUTPUT"

      # Never ship something the tests don't pass.
      - name: Fast unit tests
        run: dotnet test ${{ env.SOLUTION_DIR }}/Transcriber.Tests --filter "FullyQualifiedName!~TranscriptionTests"

      - name: Cache Whisper test model
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\TranscriberTests
          key: whisper-test-model-small-v1

      - name: End-to-end transcription tests
        run: dotnet test ${{ env.SOLUTION_DIR }}/Transcriber.Tests --filter "FullyQualifiedName~TranscriptionTests"

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      # The app bundles the default model (~490 MB); cache the verified download between runs.
      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/models
          key: bundled-whisper-model-5359861c739e955e79d9a303bcbc70fb988958b1-small

      - name: Publish (self-contained, unpackaged)
        run: >
          dotnet publish ${{ env.SOLUTION_DIR }}/Transcriber.Maui/Transcriber.Maui.csproj
          -c Release -f net10.0-windows10.0.19041.0 -r win-x64
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true -p:SelfContained=true
          -p:ApplicationDisplayVersion=${{ steps.ver.outputs.core }} -p:ApplicationVersion=${{ github.run_number }}
          -o publish/win-x64

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath "Transcriber-${{ steps.ver.outputs.version }}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Transcriber-win-x64
          path: Transcriber-*-win-x64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    # Only for real version tags. Manual runs stop after the build above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Transcriber-win-x64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" Transcriber-*-win-x64.zip
          --repo "${{ github.repository }}"
          --title "Transcriber ${{ github.ref_name }}"
          --generate-notes
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
