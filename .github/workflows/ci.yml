name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_DIR: source/Transcriber

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Runners have no GPU, so force the CPU runtime for deterministic results.
      TRANSCRIBER_TEST_CPU: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ffmpeg is downloaded from a GitHub release during the build; cache it so a slow download cannot fail the job.
      - name: Cache bundled ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/ffmpeg
            ${{ env.SOLUTION_DIR }}/Transcriber.Tests/obj/ffmpeg
          key: bundled-ffmpeg-b6.1.1-${{ runner.os }}-${{ github.job }}

      # The speaker detection tool comes out of a release archive of about 240 MB; keep the extracted program.
      - name: Cache speaker detection tool
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/sherpacli
            ${{ env.SOLUTION_DIR }}/Transcriber.Tests/obj/sherpacli
          key: sherpa-cli-v2.0.1-${{ runner.os }}-static-${{ github.job }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_DIR }}/Transcriber.Tests/Transcriber.Tests.csproj

      - name: Fast unit tests
        run: dotnet test ${{ env.SOLUTION_DIR }}/Transcriber.Tests --no-restore --filter "FullyQualifiedName!~TranscriptionTests"

      # The end-to-end tests need the ggml-small model (~490 MB). Cache it so it downloads once.
      - name: Cache Whisper test model
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\TranscriberTests
          key: whisper-test-model-small-v1

      - name: End-to-end transcription tests (English, Dutch, Arabic, Spanish)
        run: dotnet test ${{ env.SOLUTION_DIR }}/Transcriber.Tests --no-restore --filter "FullyQualifiedName~TranscriptionTests" --logger "console;verbosity=normal"

  build-app:
    name: Build MAUI app (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ffmpeg is downloaded from a GitHub release during the build; cache it so a slow download cannot fail the job.
      - name: Cache bundled ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/ffmpeg
            ${{ env.SOLUTION_DIR }}/Transcriber.Tests/obj/ffmpeg
          key: bundled-ffmpeg-b6.1.1-${{ runner.os }}-${{ github.job }}

      # The speaker detection tool comes out of a release archive of about 240 MB; keep the extracted program.
      - name: Cache speaker detection tool
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/sherpacli
            ${{ env.SOLUTION_DIR }}/Transcriber.Tests/obj/sherpacli
          key: sherpa-cli-v2.0.1-${{ runner.os }}-static-${{ github.job }}

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      # The app bundles the default model (~490 MB); cache the verified download between runs.
      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/models
          key: bundled-whisper-model-5359861c739e955e79d9a303bcbc70fb988958b1-small

      - name: Build
        run: dotnet build ${{ env.SOLUTION_DIR }}/Transcriber.Maui/Transcriber.Maui.csproj -c Release

  # Launches the real app and drives it through UI Automation, including a real mouse drag and drop.
  ui-tests:
    name: UI tests (Windows app)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ffmpeg is downloaded from a GitHub release during the build; cache it so a slow download cannot fail the job.
      - name: Cache bundled ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/ffmpeg
            ${{ env.SOLUTION_DIR }}/Transcriber.Tests/obj/ffmpeg
          key: bundled-ffmpeg-b6.1.1-${{ runner.os }}-${{ github.job }}

      # The speaker detection tool comes out of a release archive of about 240 MB; keep the extracted program.
      - name: Cache speaker detection tool
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/sherpacli
            ${{ env.SOLUTION_DIR }}/Transcriber.Tests/obj/sherpacli
          key: sherpa-cli-v2.0.1-${{ runner.os }}-static-${{ github.job }}

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: ${{ env.SOLUTION_DIR }}/Transcriber.Maui/obj/models
          key: bundled-whisper-model-5359861c739e955e79d9a303bcbc70fb988958b1-small

      - name: Build app
        run: dotnet build ${{ env.SOLUTION_DIR }}/Transcriber.Maui/Transcriber.Maui.csproj -c Release

      # The drag and drop test needs a real mouse on an interactive desktop, which the hosted runner does not give it,
      # so it only runs locally (set TRANSCRIBER_UI_DRAG=1).
      - name: UI tests
        env:
          TRANSCRIBER_UI_TESTS: '1'
          TRANSCRIBER_APP_EXE: ${{ github.workspace }}\source\Transcriber\Transcriber.Maui\bin\Release\net10.0-windows10.0.19041.0\win-x64\Transcriber.Maui.exe
        run: dotnet test ${{ env.SOLUTION_DIR }}/Transcriber.UiTests -c Release --logger "console;verbosity=normal"

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: ${{ env.SOLUTION_DIR }}/Transcriber.UiTests/bin/Release/**/screenshots/*.png
          if-no-files-found: ignore
