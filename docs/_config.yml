title: Transcriber
description: Private, offline speech tools for Windows and macOS. Transcribe recordings and practise speaking, entirely on your computer.
url: https://eomar21.github.io
baseurl: /transcriber

remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme

color_scheme: dark
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Download":
    - "https://github.com/Eomar21/transcriber/releases/latest"
  "GitHub":
    - "https://github.com/Eomar21/transcriber"
aux_links_new_tab: true

footer_content: 'Transcriber is open source under the <a href="https://github.com/Eomar21/transcriber/blob/master/LICENSE">MIT licence</a>.'

# The README is for GitHub; the site has its own pages.
exclude:
  - README.md
